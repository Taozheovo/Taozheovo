<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Research</title>
  <desc id="desc">A Swiss editorial two-column research panel in off-white, black, and gray, with geometric typography and fine rules.</desc>
  <rect width="1200" height="300" fill="#f2f2f2"/>
  <line x1="30" y1="25" x2="1170" y2="25" stroke="#111111" stroke-opacity=".16"/>
  <line x1="30" y1="275" x2="1170" y2="275" stroke="#111111" stroke-opacity=".16"/>
  <line x1="350" y1="54" x2="350" y2="246" stroke="#111111" stroke-opacity=".16"/>
  <g font-family="Clash Display, Satoshi, Arial, Helvetica, sans-serif" fill="#111111">
    <text x="48" y="134" font-size="42" font-weight="700" letter-spacing="-2">RESEARCH</text>
    <text x="48" y="166" fill="#838282" font-family="Satoshi, Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="2.5">01  /  AREAS OF INTEREST</text>
  </g>
  <g font-family="Satoshi, Arial, Helvetica, sans-serif" fill="#111111">
    <text x="395" y="91" font-size="23" font-weight="500">Research interests and current work will be added here.</text>
    <text x="395" y="137" font-size="23" font-weight="500">Further details and selected work will appear here soon.</text>
    <text x="395" y="220" fill="#838282" font-size="10" font-weight="700" letter-spacing="2.5">DETAILS COMING SOON</text>
  </g>
</svg>
